[package]
name = "bcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Cross-platform CLI wrapper around the Azure Bicep MCP server, for agents that cannot use MCP"
license = "MIT"
repository = "https://github.com/nickmoon0/bicep-cli"

[dependencies]
rmcp = { version = "3.2", default-features = false, features = ["client", "server", "transport-child-process", "transport-async-rw"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "time", "fs", "sync"] }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
